version: '3.8'

services:
  rag-backend:
    build: .
    container_name: rag-fastapi-engine
    network_mode: "host"
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
