services:
  rag-backend:
    build: .
    container_name: rag-fastapi-engine
    networks:
      - secure_airgap_net
    ports:
      - "8000:8000"
    restart: always
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_CACHE=/app/model_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  secure_airgap_net:
    driver: bridge
    internal: true